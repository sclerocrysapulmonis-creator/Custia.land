<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custia — Mini Games</title><link rel="stylesheet" href="restoration0917.css"><style>*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f0f0f0;color:#222;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;background:#f0003c;color:white;padding:18px 24px}header a{color:white;text-decoration:none}main{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden}h1{font-size:clamp(20px,4vw,38px);margin:18px}.stage{height:clamp(300px,65dvh,650px);position:relative;perspective:1000px;touch-action:pan-y;overflow:hidden;background:radial-gradient(ellipse,#fff,#e5e5e5)}.cab{position:absolute;top:4%;left:50%;width:clamp(150px,28vw,300px);height:88%;padding:clamp(12px,2vw,24px);border:1px solid #ccc;border-radius:20px 20px 9px 9px;background:linear-gradient(110deg,#ddd,#fff 20%,#fff 80%,#ccc);box-shadow:10px 20px 30px #0002;transition:transform .45s,opacity .45s;display:flex;flex-direction:column;gap:12px}.cab:after{content:'';position:absolute;bottom:-8px;left:-5%;width:110%;height:14px;background:#ddd;border-radius:50%;z-index:-1}.screen{height:53%;background:radial-gradient(#ff2857,#d90036);color:white;border:6px solid #ddd;border-radius:12px;display:grid;place-content:center;box-shadow:inset 0 0 25px #80002566}.screen strong{font-size:clamp(50px,10vw,120px);font-weight:300;line-height:1}.screen small{font-size:12px}.play{padding:12px;border:1px solid #f0003c;background:white;color:#b90030;border-radius:8px;font-weight:bold}.controls{display:flex;justify-content:center;align-items:center;gap:24px;padding:16px}.controls button{background:white;border:1px solid #bbb;border-radius:50%;width:44px;height:44px;font-size:24px}.controls button:disabled{opacity:.35}footer{text-align:center;color:#777;padding:10px;font-size:12px}#custia-lang{position:fixed;bottom:12px;right:12px;display:flex}#custia-lang button{padding:8px;border:1px solid #f0003c;background:white}#custia-lang button[aria-pressed=true]{background:#f0003c;color:white}@media(prefers-reduced-motion:reduce){.cab{transition:none}}</style></head><body><header><a href="index.html#information">← <span>Information Terminal</span></a><strong>CUSTIA / 10</strong></header><main><h1>MINI GAMES</h1><div class="stage" id="stage"></div><div class="controls"><button id="prev" aria-label="Previous">‹</button><span id="count">02 / 03</span><button id="next" aria-label="Next">›</button></div><p id="notice" role="status"></p></main><footer>CUSTIA RECREATIONAL SYSTEM</footer><script>let active=1,start=null;const stage=document.getElementById('stage');for(let i=0;i<3;i++){const c=document.createElement('article');c.className='cab';c.innerHTML='<small>CUSTIA / 0'+(i+1)+'</small><div class="screen"><strong>?</strong><small>COMING SOON</small></div><small>|||||||||</small><button class="play">PLAY</button><small>STANDBY</small>';c.onclick=()=>{if(active!==i){active=i;draw()}else document.getElementById('notice').textContent=document.documentElement.lang==='th'?'ยังไม่มีมินิเกมให้เล่น':'No mini game available yet.'};stage.append(c)}function draw(){[...stage.children].forEach((c,i)=>{let d=i-active;c.style.transform=`translateX(calc(-50% + ${d*110}%)) scale(${d?0.8:1}) rotateY(${d*-15}deg)`;c.style.opacity=d?.55:1;c.style.zIndex=d?1:3});document.getElementById('count').textContent='0'+(active+1)+' / 03';document.getElementById('prev').disabled=active===0;document.getElementById('next').disabled=active===2}function move(d){active=Math.max(0,Math.min(2,active+d));draw()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);stage.addEventListener('pointerdown',e=>start=e.clientX);stage.addEventListener('pointerup',e=>{if(start!==null&&Math.abs(e.clientX-start)>30){move(e.clientX<start?1:-1);stage.addEventListener('click',e=>e.stopImmediatePropagation(),{capture:true,once:true})}start=null});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});draw()</script><script src="language.js?v=0936"></script></body></html>
