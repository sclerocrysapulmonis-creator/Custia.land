<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custia Library</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#222;font:16px system-ui}header{background:#f0003c;color:white;padding:18px;display:flex;justify-content:space-between}header a{color:white}main{max-width:1000px;margin:auto;padding:20px}small{color:#666}button{font:inherit;cursor:pointer;padding:10px;border:1px solid #bbb;background:white;border-radius:5px}#shelf{display:flex;gap:12px;align-items:end;overflow:auto;padding:40px 24px 18px;background:#ccc;border-bottom:18px solid #fff;box-shadow:0 12px 20px #0002;perspective:900px}.book{flex:0 0 55px;height:180px;writing-mode:vertical-rl;color:white;background:var(--c);border:0;border-radius:3px;box-shadow:inset 5px 0 8px #0004,5px 2px 4px #0003;transition:transform .3s}.book:hover,.book:focus{transform:translateY(-15px)}dialog{width:min(94vw,650px);border:0;padding:20px;background:#eee}dialog::backdrop{background:#0009}#cover{margin:30px auto;width:150px;height:220px;background:var(--c);color:white;display:grid;place-items:center;text-align:center;transform:rotateY(-24deg);box-shadow:12px 4px 0 #d8d0bf,15px 5px 0 #555;transition:transform .5s}#cover:hover{transform:rotateY(0)}#reader{perspective:1000px;display:flex;position:relative;min-height:240px;background:#65182c;padding:5px}.page{flex:1;min-width:0;padding:22px;background:#fffaf0;font-family:Georgia,serif;box-shadow:inset -10px 0 15px -12px #555}.page+ .page{box-shadow:inset 10px 0 15px -12px #555}.turn{animation:flip .65s ease;transform-origin:left center}@keyframes flip{0%{transform:rotateY(-100deg)}100%{transform:rotateY(0)}}[hidden]{display:none!important}@media(max-width:500px){#reader .page:first-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><a href="index.html#information">← Information Terminal</a><strong>CUSTIA LIBRARY</strong></header><main><small>V0.9.7.0 · VISUAL PROTOTYPE</small><h1>LIBRARY.</h1><p>ต้นแบบชั้นหนังสือ — หนังสือตัวอย่าง ยังไม่ใช่ข้อมูลผู้เล่น</p><div id="shelf"></div><p>เลื่อนชั้นหนังสือและเลือกหนังสือเพื่อทดลองอ่าน</p></main><dialog id="modal"><button id="close">× Close</button><div id="cover"></div><button id="open">Open book</button><section id="reading" hidden><div id="reader"><article class="page" id="left"></article><article class="page" id="right"></article></div><p id="number"></p><button id="prev">←</button> <button id="next">→</button></section></dialog><script>
const $=id=>document.getElementById(id), titles=['Custia Archives','Untold Stories','Notebook','Beyond the Walls','Memories','Institutional Records'],colors=['#851b38','#444','#536b59','#364f75','#947354','#222'];let page=0;const samples=['Every story begins somewhere.','The library was quiet.','A forgotten memory.','Beyond the walls.','A new chapter.','The end.'];titles.forEach((title,i)=>{const b=document.createElement('button');b.className='book';b.textContent=title;b.style.setProperty('--c',colors[i]);b.onclick=()=>{$('cover').textContent=title;$('cover').style.setProperty('--c',colors[i]);$('cover').hidden=false;$('open').hidden=false;$('reading').hidden=true;$('modal').showModal()};$('shelf').append(b)});function render(){const single=matchMedia('(max-width:500px)').matches;$('left').textContent=samples[page];$('right').textContent=samples[single?page:page+1]||'';$('number').textContent=(page+1)+' / '+samples.length;$('prev').disabled=page===0;$('next').disabled=page+(single?1:2)>=samples.length;$('right').classList.remove('turn');void $('right').offsetWidth;$('right').classList.add('turn')}function move(d){const step=matchMedia('(max-width:500px)').matches?1:2;page=Math.max(0,Math.min(samples.length-1,page+d*step));render()}$('open').onclick=()=>{page=0;$('cover').hidden=true;$('open').hidden=true;$('reading').hidden=false;render()};$('close').onclick=()=>$('modal').close();$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let x; $('reader').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});$('reader').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>40)move(dx<0?1:-1)},{passive:true});addEventListener('resize',()=>{if(!$('reading').hidden)render()});
</script></html>
