<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custia Library</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#222;font:16px system-ui}header{background:#f0003c;color:white;padding:18px;display:flex;justify-content:space-between}header a{color:white}main{max-width:1000px;margin:auto;padding:20px}small{color:#666}button{font:inherit;cursor:pointer;padding:10px;border:1px solid #bbb;background:white;border-radius:5px}#shelf{display:flex;gap:12px;align-items:end;overflow:auto;padding:40px 24px 18px;background:#ccc;border-bottom:18px solid #fff;box-shadow:0 12px 20px #0002;perspective:900px}.book{flex:0 0 55px;height:180px;writing-mode:vertical-rl;color:white;background:var(--c);border:0;border-radius:3px;box-shadow:inset 5px 0 8px #0004,5px 2px 4px #0003;transition:transform .3s}.book:hover,.book:focus{transform:translateY(-15px)}dialog{width:min(94vw,650px);border:0;padding:20px;background:#eee}dialog::backdrop{background:#0009}#cover{margin:30px auto;width:150px;height:220px;background:var(--c);color:white;display:grid;place-items:center;text-align:center;transform:rotateY(-24deg);box-shadow:12px 4px 0 #d8d0bf,15px 5px 0 #555;transition:transform .5s}#cover:hover{transform:rotateY(0)}#reader{perspective:1000px;display:flex;position:relative;min-height:240px;background:#65182c;padding:5px}.page{flex:1;min-width:0;padding:22px;background:#fffaf0;font-family:Georgia,serif;box-shadow:inset -10px 0 15px -12px #555}.page+ .page{box-shadow:inset 10px 0 15px -12px #555}.turn{animation:flip .65s ease;transform-origin:left center}@keyframes flip{0%{transform:rotateY(-100deg)}100%{transform:rotateY(0)}}[hidden]{display:none!important}@media(max-width:500px){#reader .page:first-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.page{white-space:pre-wrap;overflow-wrap:anywhere}.hologram{border:2px solid #ff406a!important;box-shadow:0 0 15px #ff406a!important}.editor label{display:block;margin:12px 0}.editor input:not([type=color]),.editor select,.editor textarea{display:block;width:100%;font:inherit;padding:10px}.editor textarea{min-height:220px}.editor{max-height:90vh;overflow:auto}.editor button{margin:4px} .page img,#cover img,.editor img{display:block;max-width:100%;max-height:260px;object-fit:contain;margin:8px auto}#cover img{max-height:170px}.editor input[type=file]{max-width:100%}</style><header><a href="index.html#information">← Information Terminal</a><strong>CUSTIA LIBRARY</strong></header><main><small>V0.9.7.0 · IMAGE EDITOR PREVIEW</small><h1>LIBRARY.</h1><p>หนังสือที่เผยแพร่แล้ว</p><p id="status" role="status"></p><button id="new" hidden>+ สร้างหนังสือ</button> <a href="portal.html" id="login">เข้าสู่ระบบ</a><div id="shelf"></div><section id="drafts" hidden><h2>หนังสือของฉัน</h2><div id="mine"></div></section><p>เลื่อนชั้นหนังสือและเลือกหนังสือเพื่อทดลองอ่าน</p></main><dialog id="modal"><button id="close">× Close</button><div id="cover"></div><button id="open">Open book</button><section id="reading" hidden><div id="reader"><article class="page" id="left"></article><article class="page" id="right"></article></div><p id="number"></p><button id="prev">←</button> <button id="next">→</button></section></dialog><dialog id="editor" class="editor"><form id="form"><h2>BOOK EDITOR</h2><label>ชื่อหนังสือ<input id="title" required maxlength="150"></label><label>ชื่อผู้เขียน<input id="author" required maxlength="100"></label><label>ประเภท<select id="type"><option value="hardcover">Hardcover</option><option value="paperback">Paperback</option><option value="notebook">Notebook</option><option value="hologram">HoloBook</option></select></label><label>สีสันหนังสือ<input id="color" type="color" value="#851b38"></label><label>ภาพหน้าปก<input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="coverPreview" alt="" hidden><button type="button" id="clearCover">นำภาพปกออก</button><label>หน้า <select id="pageSelect"></select></label><textarea id="body" maxlength="20000" aria-label="เนื้อหาหน้า"></textarea><label>ภาพประกอบหน้านี้<input id="pageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="pagePreview" alt="" hidden><button type="button" id="clearImage">นำภาพออก</button><button type="button" id="add">+ เพิ่มหน้า</button><button type="button" id="remove">ลบหน้าสุดท้าย</button><p id="editStatus" role="status"></p><button type="submit" id="save">บันทึก</button><button type="button" id="publish">เผยแพร่</button><button type="button" id="cancel">ปิด</button></form></dialog><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://mtupbtlqbjtladkogjrq.supabase.co','sb_publishable_BuroUNv_POvAOMO4Gf2JsQ_3o6sPyCu');
const $=id=>document.getElementById(id), books=()=>db.from('custia_library_books'), pages=()=>db.from('custia_library_pages');let user,editing=null,draft=[''],idx=0,read=[],page=0,busy=false,dirty=false;let coverAsset=null,pageAssets=[],readAssets=[];const bucket=()=>db.storage.from("custia-library-images");const urls=new WeakMap();async function preview(img,asset){const old=urls.get(img);if(old)URL.revokeObjectURL(old);urls.delete(img);img.hidden=true;img.removeAttribute("src");const token=Symbol();img._token=token;if(!asset)return;try{let url;if(asset instanceof File){url=URL.createObjectURL(asset);if(img._token!==token){URL.revokeObjectURL(url);return}urls.set(img,url)}else{url=check(await bucket().createSignedUrl(asset,120)).signedUrl}if(img._token===token){img.src=url;img.hidden=false}}catch(e){if(img._token===token)img.alt="Image unavailable"}}function valid(f){if(!["image/png","image/jpeg","image/webp"].includes(f.type)||f.size>5242880)throw Error("PNG/JPG/WEBP ≤ 5 MB");return f}async function upload(a){if(!(a instanceof File))return a;const path=user.id+"/"+editing.id+"/"+crypto.randomUUID();check(await bucket().upload(path,a,{contentType:a.type}));return path}
function check(r){if(r.error)throw Error(r.error.message);return r.data}function run(fn,target='status'){return async()=>{try{await fn()}catch(e){$(target).textContent=e.message}}}function btn(t,fn){const b=document.createElement('button');b.textContent=t;b.onclick=run(fn);return b}
async function load(){const rows=check(await books().select('id,title,author,book_type,spine_color,published,owner_id,cover_path').order('created_at',{ascending:false}).limit(200));$('shelf').replaceChildren();$('mine').replaceChildren();for(const b of rows){if(b.published){const n=btn(b.title,()=>openBook(b));n.className='book '+(b.book_type==='hologram'?'hologram':'');n.style.setProperty('--c',b.spine_color);n.title=b.author;$('shelf').append(n)}if(user&&b.owner_id===user.id)$('mine').append(btn(b.title+(b.published?' · Published':' · Draft'),()=>edit(b)))}if(!$('shelf').children.length)$('shelf').textContent='ยังไม่มีหนังสือที่เผยแพร่'}
async function getPages(id){const rows=check(await pages().select('page_no,body,image_path').eq('book_id',id).order('page_no'));const a=Array.from({length:Math.max(1,...rows.map(r=>r.page_no))},()=> '');const assets=a.map(()=>null);for(const r of rows){a[r.page_no-1]=r.body;assets[r.page_no-1]=r.image_path}return {a,assets}}
async function openBook(b){const p=await getPages(b.id);read=p.a;readAssets=p.assets;$('cover').textContent=b.title+' — '+b.author;const img=document.createElement('img');$('cover').append(img);preview(img,b.cover_path);$('cover').style.setProperty('--c',b.spine_color);$('cover').classList.toggle('hologram',b.book_type==='hologram');$('reader').classList.toggle('hologram',b.book_type==='hologram');$('cover').hidden=false;$('open').hidden=false;$('reading').hidden=true;$('modal').showModal()}
function single(){return matchMedia('(max-width:500px)').matches}function render(){ $('left').textContent=read[page]||'';$('right').textContent=read[single()?page:page+1]||'';for(const [id,i] of [['left',page],['right',single()?page:page+1]]){const img=document.createElement('img');$(id).append(img);preview(img,readAssets[i])}$('number').textContent=(page+1)+' / '+read.length;$('prev').disabled=page===0;$('next').disabled=page+(single()?1:2)>=read.length;$('right').classList.remove('turn');void $('right').offsetWidth;$('right').classList.add('turn')}function move(d){page=Math.max(0,Math.min(read.length-1,page+d*(single()?1:2)));render()}$('open').onclick=()=>{page=0;$('cover').hidden=true;$('open').hidden=true;$('reading').hidden=false;render()};$('close').onclick=()=>$('modal').close();$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let x;$('reader').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});$('reader').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>40)move(dx<0?1:-1)},{passive:true});addEventListener('resize',()=>{if(!$('reading').hidden)render()});
function capture(){draft[idx]=$('body').value}function showPage(){ $('pageSelect').replaceChildren(...draft.map((_,i)=>new Option(String(i+1),String(i))));$('pageSelect').value=idx;$('body').value=draft[idx];$('pageFile').value='';preview($('pagePreview'),pageAssets[idx]);$('add').disabled=draft.length>=200;$('remove').disabled=draft.length<=1}
async function edit(b){editing=b;const p=b?await getPages(b.id):{a:[''],assets:[null]};draft=p.a;pageAssets=p.assets;coverAsset=b?.cover_path||null;$('coverFile').value='';preview($('coverPreview'),coverAsset);idx=0;$('title').value=b?.title||'';$('author').value=b?.author||'';$('type').value=b?.book_type||'hardcover';$('color').value=b?.spine_color||'#851b38';$('publish').textContent=b?.published?'ถอนการเผยแพร่':'เผยแพร่';$('editStatus').textContent='';showPage();dirty=false;$('editor').showModal()}
$('form').addEventListener('input',()=>dirty=true);$('pageSelect').onchange=()=>{capture();idx=Number($('pageSelect').value);showPage()};$('add').onclick=()=>{capture();if(draft.length<200){draft.push('');pageAssets.push(null);idx=draft.length-1;dirty=true;showPage()}};$('remove').onclick=()=>{if(draft.length>1&&confirm('ลบหน้าสุดท้าย?')){capture();draft.pop();pageAssets.pop();idx=Math.min(idx,draft.length-1);dirty=true;showPage()}};
$('coverFile').onchange=run(()=>{const f=$('coverFile').files[0];if(f){coverAsset=valid(f);dirty=true;preview($('coverPreview'),coverAsset)}},'editStatus');$('pageFile').onchange=run(()=>{const f=$('pageFile').files[0];if(f){pageAssets[idx]=valid(f);dirty=true;preview($('pagePreview'),pageAssets[idx])}},'editStatus');$('clearCover').onclick=()=>{coverAsset=null;dirty=true;$('coverFile').value='';preview($('coverPreview'),null)};$('clearImage').onclick=()=>{pageAssets[idx]=null;dirty=true;showPage()};async function save(toggle=false){if(busy||!$('form').reportValidity())return;busy=true;for(const e of $('form').elements)e.disabled=true;try{capture();const data={title:$('title').value.trim(),author:$('author').value.trim(),book_type:$('type').value,spine_color:$('color').value};if(!editing){editing=check(await books().insert(data).select().single())}else{check(await books().update(data).eq('id',editing.id))}coverAsset=await upload(coverAsset);for(let i=0;i<pageAssets.length;i++)pageAssets[i]=await upload(pageAssets[i]);check(await books().update({cover_path:coverAsset}).eq('id',editing.id));check(await pages().upsert(draft.map((body,i)=>({book_id:editing.id,page_no:i+1,body,image_path:pageAssets[i]||null})),{onConflict:'book_id,page_no'}));check(await pages().delete().eq('book_id',editing.id).gt('page_no',draft.length));if(toggle){const published=!editing.published;check(await books().update({published}).eq('id',editing.id));editing.published=published}$('publish').textContent=editing.published?'ถอนการเผยแพร่':'เผยแพร่';dirty=false;$('editStatus').textContent='บันทึกสำเร็จ';await load()}finally{busy=false;for(const e of $('form').elements)e.disabled=false;showPage()}}
$('form').onsubmit=e=>{e.preventDefault();run(()=>save(),'editStatus')()};$('publish').onclick=run(()=>save(true),'editStatus');function closeEditor(){if(!busy&&(!dirty||confirm('ปิดโดยไม่บันทึก?')))$('editor').close()}$('cancel').onclick=closeEditor;$('editor').oncancel=e=>{e.preventDefault();closeEditor()};$('new').onclick=run(()=>edit(null));await run(async()=>{const r=await db.auth.getSession();if(r.error)throw r.error;user=r.data.session?.user;if(user?.is_anonymous)user=null;$('new').hidden=!user;$('drafts').hidden=!user;$('login').hidden=!!user;await load()})();
</script></html>
