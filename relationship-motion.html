<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custia | Relationship Tutorial</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3f3;color:#171717;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ed003d;padding-bottom:12px}small{letter-spacing:2px;color:#bd0033}button,a{font:inherit;color:inherit}button{border:1px solid #ccc;background:white;border-radius:6px;padding:9px;cursor:pointer}.stage{position:relative;overflow:hidden;background:#fff;border:1px solid #ddd;border-radius:12px;margin:20px 0;aspect-ratio:16/10;display:grid;grid-template-columns:1.5fr 1fr}.board{position:relative;background:radial-gradient(#ddd 1px,transparent 1px) 0 0/16px 16px}.photo{position:absolute;width:27%;padding:5px;background:white;box-shadow:0 3px 10px #0003;text-align:center;font-size:clamp(8px,1.5vw,13px)}.portrait{background:white;aspect-ratio:1;display:grid;place-items:center}.portrait::before{content:"";width:64%;aspect-ratio:1;border-radius:50%;background:#d9d9d9}.one{left:12%;top:24%;transform:rotate(-5deg)}.two{right:10%;top:45%;transform:rotate(5deg);opacity:0;transition:opacity .6s}.line{position:absolute;left:30%;top:45%;width:45%;height:3px;background:#ed003d;transform:rotate(24deg);transform-origin:left;opacity:0;transition:opacity .6s}.side{padding:clamp(8px,2vw,20px);border-left:1px solid #ddd;display:flex;flex-direction:column;gap:8px;font-size:clamp(9px,1.7vw,15px)}.field,.action{border:1px solid #ccc;border-radius:5px;padding:8px;min-height:30px}.action{background:#ed003d;color:white;text-align:center}.focus{outline:3px solid #ed003d;outline-offset:3px;box-shadow:0 0 0 6px #ed003d22}.cursor{position:absolute;z-index:4;left:75%;top:20%;font-size:25px;color:#ed003d;filter:drop-shadow(1px 2px 1px white);transition:left .35s,top .35s;pointer-events:none}.caption{min-height:95px}h2{margin:0 0 8px}p{margin:5px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.track{height:4px;background:#ddd;margin:12px 0}.progress{height:100%;background:#ed003d;transition:width .3s}.muted{color:#666}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><header><div><small>CUSTIA / ARCHIVE</small><h2>Relationship Tutorial</h2></div><a href="database.html">← Database</a></header><video id="tutorial-video" autoplay muted playsinline controls preload="auto" style="display:none;width:100%;border-radius:12px;margin:20px 0" aria-label="Relationship tutorial video"></video><div class="stage" aria-label="Animated demonstration"><div class="board" id="board"><div class="line" id="line"></div><div class="photo one"><div class="portrait" aria-hidden="true"></div>YOUR CHARACTER</div><div class="photo two" id="photo"><div class="portrait" aria-hidden="true"></div>EXAMPLE 102</div></div><div class="side"><strong>RELATIONSHIP</strong><div class="field" id="search">Prisoner number or name</div><div class="field" id="kind">Relationship type</div><div class="action" id="add">+ Add Relationships</div><div class="field" id="remove">− Remove relationship</div><div class="field" id="refresh">Refresh</div></div><span class="cursor" id="cursor">➤</span></div><div class="caption" aria-live="polite"><small id="count"></small><h2 id="title"></h2><p id="th"></p><p class="muted" id="en"></p></div><div class="track"><div class="progress" id="progress"></div></div><div class="controls"><button id="prev">← Back</button><button id="play">Pause</button><button id="next">Next →</button><button id="replay">Replay ↻</button></div><p class="muted">Simulation only · ไม่มีการเปลี่ยนแปลงข้อมูลจริง</p></main><script>(()=>{const $=id=>document.getElementById(id),steps=[['Open Relationship','เปิด Relationship จากโปรไฟล์ตัวละคร','Open Relationship from the character profile.','board',30,30],['Find a character','ค้นหาด้วยชื่อหรือหมายเลขนักโทษ','Search by name or prisoner number.','search',75,24],['Choose relationship','เลือกประเภทความสัมพันธ์','Choose a relationship type.','kind',75,38],['Add relationship','กด Add Relationships เพื่อเพิ่มความสัมพันธ์','Select Add Relationships to add the relationship.','add',75,50],['View the board','ดูภาพตัวละครและเส้นความสัมพันธ์บนกระดาน','View the character and relationship line on the board.','board',45,50],['Manage relationships','เจ้าของสามารถลบความสัมพันธ์หรือรีเฟรชกระดานได้','Owners can remove a relationship or refresh the board.','remove',75,65]];let i=0,playing=true,timer,typing;function draw(){clearTimeout(timer);clearInterval(typing);document.querySelectorAll('.focus').forEach(n=>n.classList.remove('focus'));const [title,th,en,id,x,y]=steps[i];$(id).classList.add('focus');$('title').textContent=title;$('th').textContent=th;$('en').textContent=en;$('count').textContent=`STEP ${i+1} / ${steps.length}`;$('progress').style.width=(i+1)/steps.length*100+'%';$('cursor').style.left=x+'%';$('cursor').style.top=y+'%';$('search').textContent=i>=1?'102':'Prisoner number or name';if(i===1&&playing&&!matchMedia('(prefers-reduced-motion: reduce)').matches){let n=0;$('search').textContent='';typing=setInterval(()=>{ $('search').textContent='102'.slice(0,++n);if(n===3)clearInterval(typing)},100)}$('kind').textContent=i>=2?'Friend (example)':'Relationship type';$('photo').style.opacity=$('line').style.opacity=i>=3?'1':'0';$('prev').disabled=i===0;$('next').disabled=i===steps.length-1;$('play').textContent=playing?'Pause':'Play';if(playing)timer=setTimeout(()=>{if(i<steps.length-1)i++;else playing=false;draw()},2500)}$('prev').onclick=()=>{i=Math.max(0,i-1);draw()};$('next').onclick=()=>{i=Math.min(steps.length-1,i+1);draw()};$('play').onclick=()=>{playing=!playing;draw()};$('replay').onclick=()=>{i=0;playing=true;draw()};draw()})();</script><script>(()=>{const v=document.getElementById('tutorial-video');const parts=document.querySelectorAll('.stage,.caption,.track,.controls');v.addEventListener('loadeddata',()=>{v.style.display='block';document.getElementById('play').click();parts.forEach(p=>p.hidden=true);parts.forEach(p=>p.style.display='none');v.play().catch(()=>{})},{once:true});v.addEventListener('error',()=>{v.style.display='none';parts.forEach(p=>{p.hidden=false;p.style.display=''})});v.src='relationship-motion-video.mp4?v=1'})();</script></html>
