<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUSTIA — Secret Area</title><style> *{box-sizing:border-box}body{margin:0;background:#111;color:white;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:12px}header,nav{display:flex;gap:10px;align-items:center;justify-content:space-between}button,a{font:inherit;color:white;background:#222;border:1px solid #777;border-radius:8px;padding:10px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4}#scene{position:relative;aspect-ratio:1471/1023;background-size:100% 100%;overflow:hidden;margin:10px 0}#actor{position:absolute;height:92%;width:auto;max-width:65%;object-fit:contain;bottom:4%;left:50%;transform:translateX(-50%);transition:opacity .8s}#dialog{position:absolute;right:3%;top:12%;width:39%;background:#161616ee;padding:12px;border-radius:12px;min-height:80px;font-size:clamp(12px,2vw,20px)}#duckhit{position:absolute;background:transparent;border:0;padding:0;display:none}#choices{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}#item img{height:35px;vertical-align:middle}#end{position:absolute;inset:0;background:#111;display:none;place-content:center;text-align:center;font-size:26px}#name{color:#ff476f} @media(max-width:550px){#dialog{width:46%;top:5%;padding:7px}#actor{left:35%}}</style><main><header><a href="database.html">← Exit</a><strong>SECRET AREA</strong><button id="mute">Sound: ON</button></header><div id="scene"><img id="actor" alt=""><button id="duckhit" aria-label="เก็บเป็ดยาง"></button><div id="dialog"><b id="name"></b><div id="words"></div></div><div id="end"></div></div><div id="choices"></div><nav><button id="back">← ย้อนกลับ</button><button id="item" hidden><img src="secret-duck.png" alt=""> เป็ดยาง</button><button id="next">ไปต่อ →</button></nav></main><script src="secret-area.js"></script></html>
